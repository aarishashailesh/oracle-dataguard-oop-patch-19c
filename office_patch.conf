#!/usr/bin/env bash
# =============================================================================
# patch.conf � Central Patch Configuration
# Oracle 19c OOP Rolling Patch � Two-Node Data Guard
#
# DEPLOYING TO A NEW ENVIRONMENT
# ================================
# Edit ONLY the sections marked "EDIT FOR NEW ENVIRONMENT" or
# "EDIT EVERY PATCH CYCLE". All scripts source this file � nothing
# is hardcoded elsewhere. See README.md for full instructions.
#
# IDENTICAL COPY ON BOTH NODES. Place at the same absolute path on
# both the primary and standby host.
# =============================================================================

# =============================================================================
# SECTION 1: PATCH IDENTITY    <<< EDIT EVERY PATCH CYCLE >>>
# =============================================================================

NEW_PATCH_LEVEL="19.32"           # e.g. 19.32 � target patch level
OLD_PATCH_LEVEL="19.31"            # e.g. 19.3  � current patch level (base or previous RU)

# RU Combo patch bundle number (outer zip p<RU_COMBO_PATCH>_190000_Linux-x86-64.zip)
RU_COMBO_PATCH="39618711"

# GI RU bundle directory inside the extracted RU combo
GI_RU_PATCH="39467003"

# OCW sub-patch inside GI_RU_PATCH � passed to gridSetup.sh -applyRU
# This is the patch ID you see in opatch lspatches output for the GI home.
GI_APPLY_RU_PATCH="39526364"

# Additional one-off patches inside GI_RU_PATCH applied to Grid home (comma-separated)
GI_ONEOFF_PATCHES="39107825,39107855,39472050,39503034"

# DB RU sub-patch inside GI_RU_PATCH � passed to runInstaller -applyRU
DB_APPLY_RU_PATCH="39472050"

# Additional one-off patches inside GI_RU_PATCH applied to DB home (comma-separated)
DB_ONEOFF_PATCHES="39526364"

# Standalone DB patch outside the RU combo (e.g. Datapump bundle)
DB_RU_STANDALONE_PATCH="39657094"
DB_RU_STANDALONE_ZIP="p39657094_1932000DBRU_Generic.zip"

# Top-level patches inside RU combo but outside GI_RU_PATCH (e.g. OJVM)
RU_COMBO_TOPLEVEL_PATCHES="39222882"

# OPatch version patch number
OPATCH_PATCH="6880880"

# =============================================================================
# SECTION 2: NODE IDENTITY    <<< EDIT FOR NEW ENVIRONMENT >>>
# =============================================================================

PRIMARY_HOST="rsrcndbmax01pn"                    # short hostname (hostname -s) of primary node
PRIMARY_IP="XX.XX.XX.X"               # primary node IP (for reference only)
PRIMARY_DB_UNIQUE_NAME="maxprod"        # DB_UNIQUE_NAME of primary database
PRIMARY_SID="maxprod"                   # ORACLE_SID of primary instance

STANDBY_HOST="rsrcndbmax01mc"                   # short hostname (hostname -s) of standby node
STANDBY_IP="XX.XX.XX.X"             # standby node IP (for reference only)
STANDBY_DB_UNIQUE_NAME="maxprodm"       # DB_UNIQUE_NAME of standby database
STANDBY_SID="maxprod"                  # ORACLE_SID of standby instance

# Resolved at runtime � do not edit
THIS_HOST=$(hostname -s)

# =============================================================================
# SECTION 3: HOME PATHS    <<< EDIT FOR NEW ENVIRONMENT + EVERY PATCH CYCLE >>>
# =============================================================================

OLD_GRID_HOME="/u01/app/19.31.0/grid"                          # currently active Grid home
NEW_GRID_HOME="/u01/app/19.32.0/grid"                         # new Grid home to be built

OLD_DB_HOME="/u01/app/odaorahome/oracle/product/19.0.0.0/dbhome_1931"        # currently active DB home
NEW_DB_HOME="/u01/app/odaorahome/oracle/product/19.0.0.0/dbhome_1932"     # new DB home to be built

# =============================================================================
# SECTION 4: ORACLE BASE AND DERIVED DIRECTORIES    <<< EDIT FOR NEW ENVIRONMENT >>>
# =============================================================================

ORACLE_BASE="/u01/app/odaorabase/oracle"           # Oracle software owner base (oraenv ORACLE_BASE)
GRID_BASE="/u01/app/grid"              # Grid Infrastructure base
ADR_BASE="${ORACLE_BASE}/diag"         # Oracle ADR base � must be owned by oracle:oinstall
                                        # kfod fails with COM-115 if owned by grid user

# Oracle Inventory � derived from /etc/oraInst.loc at runtime
# Override here only if oraInst.loc is non-standard
ORA_INV_LOC=""                          # leave empty to auto-detect from /etc/oraInst.loc

# =============================================================================
# SECTION 5: PATCH STAGING    <<< EDIT FOR NEW ENVIRONMENT >>>
# =============================================================================
# Operator stages zips to PATCH_STAGE_DIR on EACH node independently.
# Each node extracts its own patches � no NFS or shared storage required.

PATCH_STAGE_DIR="/opt/oracle/patches"
PATCH_DIR="${PATCH_STAGE_DIR}"           # versioned RU directory
BASE_DIR="${PATCH_STAGE_DIR}/base_releases"   # 19.3 base software zips
OPATCH_DIR="${PATCH_DIR}/opatch"              # OPatch zip location

# Zip filenames � update if Oracle changes naming between releases
GRID_BASE_ZIP="LINUX.X64_193000_grid_home.zip"
DB_BASE_ZIP="LINUX.X64_193000_db_home.zip"
OPATCH_ZIP="p${OPATCH_PATCH}_190000_Linux-x86-64.zip"
RU_COMBO_ZIP="p${RU_COMBO_PATCH}_190000_Linux-x86-64.zip"

# AutoUpgrade JAR (download latest from MOS Doc ID 2485457.1)
AUTOUPGRADE_JAR="${PATCH_DIR}/autoupgrade.jar"

# Node-specific GI response files (original install response files, one per node)
GRID_RSP_PRIMARY="${PATCH_STAGE_DIR}/${PRIMARY_HOST}_grid_install.rsp"
GRID_RSP_STANDBY="${PATCH_STAGE_DIR}/${STANDBY_HOST}_grid_install.rsp"
DB_RSP_PRIMARY="${PATCH_STAGE_DIR}/${PRIMARY_HOST}_db_install.rsp"
DB_RSP_STANDBY="${PATCH_STAGE_DIR}/${STANDBY_HOST}_db_install.rsp"

# =============================================================================
# SECTION 6: LOGGING    <<< EDIT FOR NEW ENVIRONMENT >>>
# =============================================================================

LOG_BASE="/u01/patching/logs"
LOG_DIR="${LOG_BASE}/$(hostname -s)"       # resolved at runtime per node

# =============================================================================
# SECTION 7: DG BROKER SETTINGS
# =============================================================================

# "yes" = use dgmgrl for switchover/switchback (strongly preferred).
# "no"  = manual SQL path (prompts to run peer script).
USE_DG_BROKER="yes"

# =============================================================================
# SECTION 8: OS AND INSTALL SETTINGS    <<< EDIT FOR NEW ENVIRONMENT >>>
# =============================================================================

export CV_ASSUME_DISTID="OEL7.8"      # OS distro for Oracle installer � OEL7.8 for OL8
GRID_USER="grid"                       # OS user who owns Grid Infrastructure
ORACLE_USER="oracle"                   # OS user who owns Oracle Database
INSTALL_GROUP="oinstall"               # Primary group for both oracle and grid users

# =============================================================================
# SECTION 9: DERIVED PATHS � DO NOT EDIT
# These are computed from the variables above.
# =============================================================================

RU_PATCH_DIR="${PATCH_DIR}/${RU_COMBO_PATCH}"
GI_RU_BUNDLE_DIR="${RU_PATCH_DIR}/${GI_RU_PATCH}"
GI_APPLY_RU_PATH="${GI_RU_BUNDLE_DIR}/${GI_APPLY_RU_PATCH}"

GI_ONEOFF_PATHS=""
for _p in $(echo "${GI_ONEOFF_PATCHES}" | tr ',' ' '); do
  GI_ONEOFF_PATHS="${GI_ONEOFF_PATHS:+${GI_ONEOFF_PATHS},}${GI_RU_BUNDLE_DIR}/${_p}"
done; unset _p

DB_APPLY_RU_PATH="${GI_RU_BUNDLE_DIR}/${DB_APPLY_RU_PATCH}"

DB_ONEOFF_PATHS_FULL=""
for _p in $(echo "${DB_ONEOFF_PATCHES}" | tr ',' ' '); do
  DB_ONEOFF_PATHS_FULL="${DB_ONEOFF_PATHS_FULL:+${DB_ONEOFF_PATHS_FULL},}${GI_RU_BUNDLE_DIR}/${_p}"
done; unset _p
for _p in $(echo "${RU_COMBO_TOPLEVEL_PATCHES}" | tr ',' ' '); do
  [[ -n "${_p}" ]] && \
  DB_ONEOFF_PATHS_FULL="${DB_ONEOFF_PATHS_FULL:+${DB_ONEOFF_PATHS_FULL},}${RU_PATCH_DIR}/${_p}"
done; unset _p
DB_ONEOFF_PATHS_FULL="${DB_ONEOFF_PATHS_FULL},${PATCH_DIR}/${DB_RU_STANDALONE_PATCH}"
